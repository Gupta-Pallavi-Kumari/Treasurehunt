<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login | Treasure Hunt</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="center-page"><main class="panel login-panel"><p class="kicker">Treasure Hunt / Coordinator</p><h1>Admin login</h1>{% with messages = get_flashed_messages() %}{% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button primary" type="submit">Sign in <span>-></span></button></form><a class="back-link" href="{{ url_for('index') }}">Back to student login</a></main></body></html>
