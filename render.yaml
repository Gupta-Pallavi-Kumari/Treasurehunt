services:
  - type: web
    name: ads-treasure-hunt
    runtime: python
    buildCommand: pip install -r requirements.txt && python import_team_logins.py
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
